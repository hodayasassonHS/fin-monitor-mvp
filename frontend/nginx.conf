# Serves the dashboard bundle and reverse-proxies the API on the same origin.
#
# Same-origin is the point. The browser then makes no cross-origin requests at all, so there is
# no CORS to configure, no preflight on the ingestion POST, and no credentialed-origin problem
# for the SignalR WebSocket. The Vite dev server proxies the identical two paths, so development
# and production share one topology rather than two that diverge.

# WebSockets need `Connection: upgrade` when upgrading and nothing when not. This maps the
# request's Upgrade header to the right value; without it the SignalR handshake fails here and
# nowhere else, which is a miserable thing to debug. `map` is only valid in the http context —
# files under conf.d are included there, so this is in the right place.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream finmonitor_api {
    server api:8080;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints asset filenames, so their contents can never change under a given name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The entry point must never be cached, or a deploy leaves browsers loading an old bundle
    # that references asset hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://finmonitor_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://finmonitor_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # A live dashboard can legitimately sit quiet for a long time between transactions. The
        # default 60s read timeout would tear the socket down mid-quiet-spell and make the
        # dashboard look like it keeps dropping.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Client-side routing: /monitor and /add are React Router paths with no file behind them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
