# Compose-only nginx configuration, mounted over the one baked into the image.
#
# The image ships a single upstream because in Kubernetes the Service does the load balancing.
# Here there is no Service, so nginx plays that role and needs both replicas listed by name —
# which is also what makes the demo meaningful: requests land on either replica, and the
# dashboard has to show the same data regardless of which one it reached.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream finmonitor_api {
    server api-a:8080;
    server api-b:8080;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://finmonitor_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /hubs/ {
        proxy_pass http://finmonitor_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
