# The static dashboard. Separate from the API because they scale on entirely different signals:
# the bundle is bytes over a CDN-shaped workload, the API holds long-lived stateful connections.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finmonitor-dashboard
  namespace: finmonitor
  labels:
    app.kubernetes.io/name: finmonitor-dashboard
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: finmonitor-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finmonitor-dashboard
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: finmonitor/dashboard:1.0.0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx writes its pid and request bodies to disk, so a read-only root needs these
            # mounted as scratch.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: finmonitor-dashboard
  namespace: finmonitor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: finmonitor-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
